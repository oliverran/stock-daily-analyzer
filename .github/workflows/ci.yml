name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.9 builds are available for 24.04, but not Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
      - name: Tests
        run: |
          pytest -q

      - name: Install report browser checks
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check offline report in Chromium
        if: matrix.python-version == '3.12'
        run: python scripts/check_demo_report.py
      - name: Upload report screenshots
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: offline-report-screenshots
          path: reports/browser-check/screenshots/
          if-no-files-found: ignore
          retention-days: 7
